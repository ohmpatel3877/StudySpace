name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx oxlint

      - name: Build
        run: npm run build

      - name: E2E tests (mock frontend)
        run: npm run test:e2e:mock

      - name: Cargo check (src-tauri)
        run: |
          cd src-tauri
          cargo check 2>&1 || echo "cargo not available, skipping"
        shell: bash

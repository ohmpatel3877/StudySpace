<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <title>StudySpace Mock Frontend</title>
  <style>
    /* Themes definitions */
    html.theme-dark {
      --bg-color: rgba(30, 30, 30, 0.75);
      --text-color: #f3f4f6;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #3b82f6;
      --blur-val: 12px;
    }
    html.theme-light {
      --bg-color: rgba(243, 244, 246, 0.75);
      --text-color: #1f2937;
      --border-color: rgba(0, 0, 0, 0.1);
      --accent-color: #2563eb;
      --blur-val: 12px;
    }
    html.theme-amoled {
      --bg-color: #000000;
      --text-color: #ffffff;
      --border-color: #06b6d4;
      --accent-color: #06b6d4;
      --blur-val: 0px;
    }
    html.theme-colored-glass {
      --bg-color: rgba(88, 28, 135, 0.5);
      --text-color: #f3e8ff;
      --border-color: rgba(168, 85, 247, 0.4);
      --accent-color: #a855f7;
      --blur-val: 16px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    /* Glassmorphism helpers */
    .glass {
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--border-color);
    }

    /* Layout structure */
    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #sidebar {
      width: 250px;
      min-width: 150px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      padding: 10px;
      box-sizing: border-box;
    }

    #main-content {
      display: flex;
      flex-grow: 1;
      height: 100%;
      position: relative;
    }

    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-sizing: border-box;
      min-width: 200px;
    }

    #split-pane-resizer {
      width: 8px;
      background-color: var(--border-color);
      cursor: col-resize;
      flex-shrink: 0;
      height: 100%;
      transition: background-color 0.2s;
    }
    #split-pane-resizer:hover {
      background-color: var(--accent-color);
    }

    #viewer-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-sizing: border-box;
      border-left: 1px solid var(--border-color);
      min-width: 200px;
    }

    /* Components styling */
    .nav-btn {
      padding: 8px 12px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: inherit;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .file-item {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .file-item:hover, .file-item.selected {
      background: rgba(255, 255, 255, 0.1);
    }
    .file-item.disabled {
      color: #6b7280;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    textarea {
      width: 100%;
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      color: inherit;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      resize: none;
    }

    .preview-box {
      width: 100%;
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* Viewer styles */
    .viewer-content {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    /* Code highlights */
    .keyword { color: #f43f5e; font-weight: bold; }
    .type { color: #60a5fa; }
    .string { color: #34d399; }
    .comment { color: #9ca3af; font-style: italic; }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }
    .toast {
      padding: 10px 20px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 2px solid var(--accent-color);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="glass">
  <div id="app-container">
    
    <!-- Sidebar -->
    <div id="sidebar" data-testid="sidebar">
      <h3>StudySpace</h3>
      <button class="nav-btn active" id="btn-workspace" data-testid="tab-workspace">Workspace</button>
      <button class="nav-btn" id="btn-d2l" data-testid="tab-d2l">D2L Calendar</button>
      <button class="nav-btn" id="btn-settings" data-testid="tab-settings">Settings</button>
      
      <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
      
      <!-- Explorer Section -->
      <div id="explorer-section" style="flex-grow: 1; display: flex; flex-direction: column;">
        <h5 style="margin: 0 0 8px 0;">Files</h5>
        <div id="file-list" style="flex-grow: 1; overflow-y: auto;">
          <!-- Populated by script -->
        </div>
        <div style="margin-top: 8px; display: flex; gap: 4px;">
          <input type="text" id="new-file-name" data-testid="new-file-name" placeholder="newfile.md" style="flex-grow: 1; padding: 4px; border-radius: 4px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.1); color: inherit;">
          <button id="btn-create-file" data-testid="create-file-btn" style="padding: 4px 8px; border-radius: 4px; background: var(--accent-color); color: #fff; border: 0; cursor: pointer;">Add</button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
      
      <!-- Editor Pane -->
      <div id="editor-pane" data-testid="editor-pane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 id="editor-title" data-testid="editor-header-title">No file selected</h4>
          <div style="display: flex; gap: 6px;">
            <button id="btn-preview-toggle" data-testid="preview-toggle" class="nav-btn" style="margin-bottom:0; padding: 4px 8px;">Preview</button>
            <button id="btn-save" data-testid="save-button" class="nav-btn" style="margin-bottom:0; padding: 4px 8px; background: var(--accent-color); color:#fff;">Save</button>
          </div>
        </div>
        <textarea id="editor-textarea" data-testid="markdown-textarea" placeholder="Type Markdown here..."></textarea>
        <div id="editor-preview" data-testid="markdown-preview" class="preview-box hidden"></div>
      </div>

      <!-- Resizer divider -->
      <div id="split-pane-resizer" data-testid="split-pane-resizer"></div>

      <!-- Viewer Pane -->
      <div id="viewer-pane" data-testid="viewer-pane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 style="margin:0;">Resource Viewer</h4>
          <div style="display: flex; gap: 6px;">
            <button id="open-default-app-btn" data-testid="open-default-app-btn" class="nav-btn" style="margin-bottom:0; padding: 4px 8px; font-size: 12px; display: none;">Open in Default App</button>
            <button id="edit-inline-btn" data-testid="edit-inline-btn" class="nav-btn" style="margin-bottom:0; padding: 4px 8px; font-size: 12px; display: none;">Edit Inline</button>
          </div>
        </div>
        <div class="viewer-content" style="height: calc(100% - 40px);">
          <!-- Fallback or empty visualizer -->
          <div id="viewer-fallback" data-testid="viewer-fallback" style="text-align: center; margin-top: 40px; color: #9ca3af;">
            Select a file to inspect.
          </div>
          
          <!-- Office Loader (R8) -->
          <div id="office-loader" data-testid="office-loader" class="hidden" style="text-align: center; margin-top: 40px;">
            <div style="font-weight:bold; margin-bottom:8px;">Converting document... Please wait.</div>
            <div id="office-progress" data-testid="office-progress" style="font-size:13px; color:#10b981;">Conversion Progress: 0%</div>
          </div>
          
          <!-- PDF Viewer -->
          <div id="viewer-pdf" class="hidden" style="width: 100%; height: 100%;">
            <iframe id="pdf-frame" data-testid="pdf-iframe" style="width: 100%; height: 100%; border: 0;"></iframe>
          </div>

          <!-- STL CAD Viewer -->
          <div id="viewer-cad" data-testid="cad-viewer" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px;">
            <canvas id="three-canvas" data-testid="three-canvas" style="width: 100%; flex-grow: 1; background: #111; display: block;"></canvas>
            <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
              <label>
                <input type="checkbox" id="auto-rotate-toggle" data-testid="auto-rotate-toggle"> Auto-Rotate Mesh
              </label>
              <div id="canvas-status" data-testid="canvas-status" style="font-size: 12px; color: #10b981;">WebGL Context Active</div>
            </div>
          </div>

          <!-- Code Viewer -->
          <div id="viewer-code" data-testid="code-viewer" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px;">
            <div id="code-content-wrapper" style="flex-grow:1; overflow: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre; box-sizing: border-box;">
              <!-- Rendered code tokens -->
            </div>
            <textarea id="inline-code-textarea" data-testid="inline-code-textarea" class="hidden" style="flex-grow:1; font-family: monospace;"></textarea>
          </div>
        </div>
      </div>

      <!-- Settings Panel / Overlay -->
      <div id="settings-panel" data-testid="settings-panel" class="hidden" style="position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg-color); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10; padding: 20px; box-sizing: border-box; overflow-y: auto;">
        <h3>Global Settings</h3>
        <div style="display:flex; flex-direction:column; gap:16px; max-width: 500px;">
          
          <!-- Theme Engine Switcher -->
          <div>
            <label style="display:block; margin-bottom:6px; font-weight:bold;">Custom Theme</label>
            <select id="theme-select" data-testid="theme-select" style="width:100%; padding: 8px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
              <option value="Dark Mode">Dark Mode</option>
              <option value="Light Mode">Light Mode</option>
              <option value="AMOLED Mode">AMOLED Mode</option>
              <option value="Colored Glass Mode">Colored Glass Mode</option>
            </select>
          </div>

          <!-- D2L iCal Feed Settings -->
          <div id="d2l-settings-group">
            <label style="display:block; margin-bottom:6px; font-weight:bold;">D2L Calendar Private iCal Feed URL</label>
            <input type="text" id="d2l-feed-url-input" data-testid="d2l-feed-url-input" placeholder="https://d2l.myuniversity.edu/feed.ics" style="width:100%; padding: 8px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
          </div>

          <!-- Feature Toggles -->
          <div>
            <label style="display:block; margin-bottom:8px; font-weight:bold;">Modular Feature Toggles</label>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span>Enable 3D CAD Viewer</span>
              <button id="toggle-cad-viewer" data-testid="toggle-cad-viewer" class="nav-btn" style="margin-bottom:0;">Enabled</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span>Enable D2L Calendar Sync</span>
              <button id="toggle-d2l-sync" data-testid="toggle-d2l-sync" class="nav-btn" style="margin-bottom:0;">Enabled</button>
            </div>

          </div>

          <!-- External Location Import (R7) -->
          <div style="border-top: 1px solid var(--border-color); padding-top: 16px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">Import External File Location</label>
            
            <div style="display:flex; flex-direction:column; gap:8px;">
              <select id="import-type-select" data-testid="import-type-select" style="width:100%; padding: 6px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
                <option value="local">Local Directory</option>
                <option value="webdav">WebDAV Share</option>
                <option value="smb">SMB Network Share</option>
              </select>
              
              <input type="text" id="import-path-input" data-testid="import-path-input" placeholder="path/or/url/to/import" style="width:100%; padding: 6px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
              
              <div id="import-credentials-group" style="display:flex; gap:8px;">
                <input type="text" id="import-username-input" data-testid="import-username-input" placeholder="Username (optional)" style="width:50%; padding: 6px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
                <input type="password" id="import-password-input" data-testid="import-password-input" placeholder="Password (optional)" style="width:50%; padding: 6px; border-radius:4px; border:1px solid var(--border-color); background: rgba(0,0,0,0.1); color:inherit;">
              </div>
              
              <button id="import-submit-btn" data-testid="import-submit-btn" class="nav-btn" style="background:var(--accent-color); color:#fff; width:100%; text-align:center; margin-bottom:0;">Import Location</button>
            </div>
            
            <div style="margin-top: 12px;">
              <h5 style="margin: 0 0 6px 0;">Imported Locations</h5>
              <div id="imported-locations-list" data-testid="imported-locations-list" style="display:flex; flex-direction:column; gap:6px;">
                <!-- Rendered dynamically -->
              </div>
            </div>
          </div>

          <div>
            <button id="btn-save-settings" data-testid="save-settings-btn" class="nav-btn" style="background:var(--accent-color); color:#fff; width:100%; text-align:center;">Save Configurations</button>
          </div>

        </div>
      </div>

      <!-- D2L Calendar Dashboard Panel / Overlay -->
      <div id="d2l-panel" data-testid="d2l-dashboard" class="hidden" style="position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg-color); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9; padding: 20px; box-sizing: border-box; overflow-y: auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3>D2L Course Assignments Dashboard</h3>
          <button id="d2l-sync-button" data-testid="d2l-sync-button" class="nav-btn" style="margin-bottom:0;">Sync Calendar</button>
        </div>
        
        <div id="d2l-sync-status" data-testid="d2l-sync-status" style="margin-bottom: 10px; font-size:14px; display: none;"></div>

        <div id="d2l-events-list" style="display:flex; flex-direction:column; gap:10px;">
          <!-- Populated by script -->
        </div>
      </div>

    </div>

  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
